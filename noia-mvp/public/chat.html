<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOIA - Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-blue-600">NOIA</h1>
            <div class="flex items-center space-x-4">
                <span id="userName" class="text-gray-700"></span>
                <button
                    id="logoutBtn"
                    class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition"
                >
                    Déconnexion
                </button>
            </div>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-1 overflow-hidden flex flex-col max-w-4xl mx-auto w-full p-4">
        <!-- Messages Container -->
        <div id="chatMessages" class="flex-1 overflow-y-auto space-y-4 mb-4">
            <!-- Welcome Message -->
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                <p class="text-gray-700">
                    <strong>Bienvenue sur NOIA</strong> - Votre assistant intelligent pour l'administration territoriale.
                </p>
                <p class="text-sm text-gray-600 mt-2">
                    Posez vos questions sur le droit administratif, les procédures, les grilles RH, etc.
                </p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white rounded-lg shadow-md p-4">
            <form id="messageForm" class="flex space-x-2">
                <textarea
                    id="messageInput"
                    rows="2"
                    placeholder="Posez votre question..."
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                ></textarea>
                <button
                    type="submit"
                    id="sendBtn"
                    class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition disabled:bg-gray-400"
                >
                    Envoyer
                </button>
            </form>
            <div class="mt-2 text-xs text-gray-500">
                ⚠️ Ne communiquez jamais de données personnelles (noms, prénoms, adresses) dans vos questions.
            </div>
        </div>
    </main>

    <script src="js/chat.js"></script>
</body>
</html>
